<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D&amp;D Master — варианты клика</title><style>
:root{color-scheme:dark;font-family:Georgia,serif;background:#081126;color:#e8f4ff}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 75% 10%,#362452 0,transparent 36%),#081126}.panel{width:min(760px,calc(100% - 32px));padding:34px;border:1px solid #3c5578;border-radius:22px;background:#101d38;box-shadow:0 24px 70px #010612}.eyebrow{color:#9db9d5;font:13px system-ui;letter-spacing:.14em;text-transform:uppercase}h1{color:#72d6d0;font-weight:400;margin:.25em 0}.note{color:#9db9d5;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:26px}.choice{padding:18px;text-align:left;color:#e8f4ff;background:linear-gradient(145deg,#21345b,#17284a);border:1px solid #3c5578;border-radius:14px;cursor:pointer;min-height:126px}.choice:hover,.choice:focus-visible{border-color:var(--tone);outline:none;box-shadow:0 0 20px color-mix(in srgb,var(--tone) 25%,transparent)}.choice strong{display:block;color:var(--tone);font:20px Georgia;margin-bottom:8px}.choice span{display:block;color:#b7cae0;font:14px system-ui;line-height:1.4}.choice small{display:block;margin-top:10px;color:#718ca9;font:12px system-ui}.status{min-height:24px;color:#72d6d0;font:14px system-ui;margin-top:18px}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:22px}}
</style></head><body><main class="panel"><div class="eyebrow">Автономная прослушка · Web Audio API</div><h1>Как должен звучать клик?</h1><p class="note">Четыре разных жеста, а не эквалайзер одного исходника. Нажимайте в любом порядке; внешние файлы и сборка приложения не нужны.</p><div class="grid">
<button class="choice" style="--tone:#72d6d0" data-sound="crystal"><strong>✦ A · Кристальная руна</strong><span>Яркий стеклянный двухтональный щелчок с очень коротким хвостом.</span><small>880→660 Гц · sine + triangle · 95 мс</small></button>
<button class="choice" style="--tone:#d7b86a" data-sound="quill"><strong>⌁ B · Перо и латунь</strong><span>Сухой шорох пера, за которым следует тёплый металлический тик.</span><small>filtered noise + 1180 Гц · 125 мс</small></button>
<button class="choice" style="--tone:#b58af0" data-sound="arcane"><strong>◇ C · Арканная искра</strong><span>Короткий восходящий импульс с воздушным верхним обертоном.</span><small>420→1260 Гц · saw + sine · 150 мс</small></button>
<button class="choice" style="--tone:#ef8f72" data-sound="rune"><strong>ᚱ D · Каменная руна</strong><span>Плотный, но ясный деревянно-каменный удар без глухого басового хвоста.</span><small>240→150 Гц + 1.7 кГц transient · 85 мс</small></button>
</div><div class="status" aria-live="polite">Готово к прослушке.</div></main><script>
let audio;const names={crystal:'A · Кристальная руна',quill:'B · Перо и латунь',arcane:'C · Арканная искра',rune:'D · Каменная руна'};
function ctx(){audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function gain(a,t,peak,end){const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+end);g.connect(a.destination);return g}
function tone(a,g,type,f0,f1,t,d,delay=0){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t+delay);o.frequency.exponentialRampToValueAtTime(f1,t+delay+d);o.connect(g);o.start(t+delay);o.stop(t+delay+d+.01)}
function noise(a,duration,filterFreq,t,peak=.065){const n=Math.ceil(a.sampleRate*duration),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=gain(a,t,peak,duration);f.type='bandpass';f.frequency.value=filterFreq;f.Q.value=1.4;s.buffer=b;s.connect(f);f.connect(g);s.start(t);s.stop(t+duration)}
function play(kind){const a=ctx(),t=a.currentTime+.012;if(kind==='crystal'){const g=gain(a,t,.07,.095);tone(a,g,'sine',880,660,t,.085);tone(a,g,'triangle',1760,1320,t,.055,.008)}if(kind==='quill'){noise(a,.055,3200,t,.045);const g=gain(a,t+.025,.052,.1);tone(a,g,'triangle',1180,940,t+.025,.09)}if(kind==='arcane'){const g=gain(a,t,.045,.15);tone(a,g,'sawtooth',420,1260,t,.13);tone(a,g,'sine',1260,1680,t,.1,.025)}if(kind==='rune'){const g=gain(a,t,.075,.085);tone(a,g,'triangle',240,150,t,.075);const h=gain(a,t,.032,.035);tone(a,h,'square',1700,1250,t,.025)}document.querySelector('.status').textContent='Сейчас звучит: '+names[kind]}
document.querySelectorAll('[data-sound]').forEach(b=>b.addEventListener('click',()=>play(b.dataset.sound)));
</script></body></html>
