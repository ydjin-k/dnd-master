# Профиль проекта D&D Master. Читается через `. .studio/project.conf` — обычный shell.
# Переносимая студия (`gamestudio/`) стека не знает: все команды и пути — здесь.

# ── установка и ворота ───────────────────────────────────────────────────────
INSTALL_CMD="npm install && bash src-tauri/models/fetch-models.sh"
GATES_CMD="npm run gate"

# ── съёмка кадров и headless-прогон ──────────────────────────────────────────
# TBD: инфраструктуры ещё нет, писать фиктивную команду хуже, чем оставить
# пусто. SHOTS_CMD — когда появится визуальное регресс-тестирование (эталонные
# кадры для боевой сетки/интерфейса). HEADLESS_GAMES_CMD — когда у процедурного
# движка (GAME.md п.1) появится headless-режим с фиксированным сидом для
# детерминированного прогона партии без GUI.
SHOTS_CMD=""
HEADLESS_GAMES_CMD=""

# ── счёт кода (§1 STUDIO.md: игра лидирует по строкам, обгоняя tst+doc) ──────
PROD_FIND="find src src-tauri/src -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.rs' \) ! -name '*.test.*' ! -name '*.spec.*' ! -path '*/target/*' ! -path '*/node_modules/*'"
STYLE_FIND="find src -type f -name '*.css'"
TEST_FIND="find src src-tauri -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) -o -path '*/src-tauri/tests/*' -name '*.rs'"
DOC_FIND="find docs/design docs/ui -type f -name '*.md' 2>/dev/null; find docs -maxdepth 1 -name 'RULES.md' 2>/dev/null"

# ── рабочие деревья воркеров (§1 STUDIO.md — обязаны быть исключены из ворот) ─
WORKTREES_DIR=".worktrees"

# ── зоны, по которым режется очередь (§2 STUDIO.md, обычно 5-7) ──────────────
ZONES=(
  "engine"      # процедурный движок мастера: ветки, таблицы, кубики, опциональный ИИ-коннектор
  "combat"      # тактическое поле, ходы монстров/NPC
  "characters"  # лист персонажа, импорт PDF/DOCX/OCR, инвентарь, состояния
  "journal"     # дневник путешествий, состояние стола/кампании
  "audio"       # звуки и музыка, базовый комплект и пользовательские папки
  "rules"       # SRD-правила, подсказки, кастомизация правил
  "ui-shell"    # фэнтезийное оформление, раскладка, общие компоненты интерфейса
)

# ── логический размер экрана (запрещено трогать Developer/UI-Developer вне
#    своих карточек — см. roles/developer.md, roles/ui-developer.md) ─────────
# TBD: не определено. Приложение — насыщенный UI (листы персонажей, дневник,
# чат с мастером), а не canvas-игра с пиксель-артом, как эталонный «Пилот» —
# нужен ли вообще фиксированный логический бокс и на что он влияет (вероятно,
# только боевая сетка), решить отдельно с владельцем/Architect, а не
# домысливать здесь числа, которые потом будет запрещено трогать.
LOGICAL_BOX=""
SCALES=""

# ── худшая локаль для проверки раскладки на самом длинном тексте ────────────
# TBD: локализация не обсуждалась и не входит в v1 (GAME.md). Если приложение
# останется русскоязычным без i18n, этот параметр может не понадобиться вовсе.
WORST_LOCALE=""
